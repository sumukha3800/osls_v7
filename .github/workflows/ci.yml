name: CI

on:
  push:
    branches: [4.x]
  pull_request:

env:
  SLS_IGNORE_WARNING: '*'
  FORCE_COLOR: 1

jobs:
  checks:
    name: '[Linux] Node 24: Formatting, lint, build & packaging tests'
    runs-on: ubuntu-latest
    env:
      SLS_SCHEMA_CACHE_BASE_DIR: /home/runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 30

      - name: Retrieve last 4.x commit (for `git diff` purposes)
        run: |
          git checkout -b pr
          git fetch --prune --depth=30 origin +refs/heads/4.x:refs/remotes/origin/4.x
          git checkout 4.x
          git checkout pr

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate formatting
        run: pnpm run prettier-check:updated

      - name: Validate lint rules
        run: pnpm run lint:updated

      - name: Build
        run: pnpm run build

      - name: Validate docs coverage
        run: pnpm run docs-check

      - name: Packaging tests
        run: pnpm run integration-test-run-package

      - name: Large zip memory smoke test
        run: NODE_OPTIONS="--max-old-space-size=256 --expose-gc" SERVERLESS_LARGE_ZIP_SMOKE=1 pnpm exec mocha --config test/mocha/config.json test/unit/lib/plugins/package/lib/zip-service.test.ts --grep "large zip memory smoke"

      - name: Smoke test the packed package
        run: |
          npm pack ./dist --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cp -R test/fixtures/programmatic/function/. "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/osls-ts7-*.tgz
          npx osls-ts7 --version
          npx osls-ts7 print

      - name: Smoke test a TypeScript service configuration with the packed package
        run: |
          mkdir "$RUNNER_TEMP/typescript-consumer"
          cp test/typescript-consumers/esm/package.json test/typescript-consumers/esm/serverless.ts "$RUNNER_TEMP/typescript-consumer"
          cd "$RUNNER_TEMP/typescript-consumer"
          npm install "$RUNNER_TEMP"/osls-ts7-*.tgz
          npx osls-ts7 print

  typescript:
    name: '[Linux] Node 24: TypeScript 7 types, consumers & dependency types'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Validate configuration types match the configuration schema
        run: pnpm run generate-types --check

      - name: Build
        run: pnpm run build

      # TypeScript 7 projects (ES modules, CommonJS, bundler) type check against the built package
      - name: Type check TypeScript consumer projects
        run: pnpm run typecheck:consumers

      - name: Audit dependency types
        run: pnpm run audit:types

  audit:
    name: '[Linux] Security audit of dependencies'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      # Reads the lockfile: fails on high and critical advisories
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  unit:
    name: '[${{ matrix.os }}] Node ${{ matrix.node }}: Unit tests'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22.x }
          - { os: ubuntu-latest, node: 24.x }
          - { os: windows-latest, node: 22.x }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        if: runner.os == 'Linux'
        # Some tests depend on TTY support, which is missing in GA runner
        # Workaround taken from https://github.com/actions/runner/issues/241#issuecomment-577360161
        run: script -e -c "pnpm run test --bail"

      - name: Unit tests
        if: runner.os != 'Linux'
        run: pnpm run test --bail
